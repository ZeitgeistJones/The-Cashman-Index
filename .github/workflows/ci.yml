name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  pipeline:
    name: Pipeline logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No pybaseball here on purpose: the tests use offline fixtures, so this
      # job stays fast and never depends on Baseball Reference being reachable.
      - run: python scripts/test_build_moves.py
      - run: python scripts/test_scoring.py
      - run: python scripts/test_season_index.py
