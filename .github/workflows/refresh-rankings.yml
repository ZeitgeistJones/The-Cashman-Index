name: Refresh ranking data

# Rebuilds franchise / GM / exit / season datasets from MLB Stats API + Baseball
# Cube payrolls, using the checked-in GM tenure file. Commits JSON back.
#
# The daily refresh-data workflow already rebuilds these indexes after a live
# league-moves fetch. This weekly job is a lighter rankings-only safety net
# (draft cache / payroll / season) without re-pulling all 30 clubs' transactions.
#
# Scheduled runs only fire on the repository's default branch.

on:
  workflow_dispatch:
  schedule:
    # Mondays, off :00/:30 contention; after the daily refresh-data window.
    # Second weekday backstop in case the morning slot is delayed.
    - cron: "17 11 * * 1"
    - cron: "41 20 * * 1"

permissions:
  contents: write

concurrency:
  # Shared with refresh-data so commit-push jobs cannot race.
  group: refresh-site-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Verify scoring logic
        run: |
          python scripts/test_scoring.py
          python scripts/test_season_index.py

      - name: Build ranking datasets
        run: |
          python scripts/build_draft_index.py --use-cache || python scripts/build_draft_index.py
          python scripts/build_rankings.py
          python scripts/build_season_index.py

      - name: Upload data as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranking-data
          path: |
            data/team_seasons.json
            data/franchise_index.json
            data/gm_index.json
            data/exit_resumes.json
            data/yearly_index.json
            data/season_index.json
            data/draft_index.json
            data/draft_picks.json
          if-no-files-found: warn

      - name: Commit refreshed rankings
        run: |
          if git diff --quiet -- \
            data/team_seasons.json \
            data/franchise_index.json \
            data/gm_index.json \
            data/exit_resumes.json \
            data/yearly_index.json \
            data/season_index.json \
            data/draft_index.json \
            data/draft_picks.json; then
            echo "ranking data unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/team_seasons.json \
            data/franchise_index.json \
            data/gm_index.json \
            data/exit_resumes.json \
            data/yearly_index.json \
            data/season_index.json \
            data/draft_index.json \
            data/draft_picks.json
          git commit -m "Refresh franchise, GM, draft, and season ranking datasets"
          git push

      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK unset — relying on Vercel Git auto-deploy."
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
          echo "Deploy hook fired."
