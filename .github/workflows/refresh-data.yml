name: Refresh moves data

# Rebuilds the Front Office Index trade/ledger datasets from the live MLB Stats
# API and Baseball Reference, then refreshes every downstream index the site
# imports (trade, acquisition, rankings, season construction). Commits JSON
# back to the branch. GitHub runners have unrestricted outbound network — this
# is the supported refresh path.
#
# Trigger: Actions tab → "Run workflow", or the daily schedule below.
#
# IMPORTANT — scheduled runs only fire on the repository's *default* branch.
# If the default branch changes away from the branch that carries this file,
# merge (or re-point default) before expecting cron to keep the ledger fresh.
# workflow_dispatch works on any branch that has this workflow.

on:
  workflow_dispatch:
  schedule:
    # Daily 06:00 UTC — early morning, away from peak US/EU API traffic.
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  # Shared with refresh-rankings so two commit-push jobs cannot race.
  group: refresh-site-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Verify pipeline logic
        run: |
          python scripts/test_build_moves.py
          python scripts/test_scoring.py
          python scripts/test_season_index.py

      # Live fetch (no --use-cache): production refresh must pull new
      # transactions through "today". Writes data/league_moves.json and, when
      # NYY is included (always in a full run), data/moves.json. Per-team raw
      # rows land under data/transactions/by_team/ (gitignored) for reuse below.
      - name: Build league moves + Yankees ledger
        run: python scripts/build_league_moves.py --start-year 2006

      - name: Build trade index
        run: python scripts/build_trade_index.py

      # Reuses the fresh by_team caches from the league-moves step above.
      - name: Build acquisition index
        run: python scripts/build_league_acquisition.py --use-cache --start-year 2006

      - name: Build draft, rankings, and season indexes
        run: |
          python scripts/build_draft_index.py --use-cache || python scripts/build_draft_index.py
          python scripts/build_rankings.py
          python scripts/build_season_index.py

      - name: Upload data as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moves-data
          path: |
            data/league_moves.json
            data/moves.json
            data/trade_index.json
            data/acquisition_index.json
            data/team_seasons.json
            data/franchise_index.json
            data/gm_index.json
            data/exit_resumes.json
            data/yearly_index.json
            data/season_index.json
            data/draft_index.json
            data/draft_picks.json
          if-no-files-found: warn

      - name: Commit refreshed data
        run: |
          DATA_FILES="\
            data/league_moves.json \
            data/moves.json \
            data/trade_index.json \
            data/acquisition_index.json \
            data/team_seasons.json \
            data/franchise_index.json \
            data/gm_index.json \
            data/exit_resumes.json \
            data/yearly_index.json \
            data/season_index.json \
            data/draft_index.json \
            data/draft_picks.json"
          if git diff --quiet -- $DATA_FILES; then
            echo "ledger/ranking data unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $DATA_FILES
          git commit -m "Refresh league ledger and ranking indexes from live sources"
          git push

      # Last, deliberately: a mistyped override is a wrong number on the site,
      # so the job should go red — but only after the good data has landed.
      # --no-war keeps this to seconds. Cache path is the Yankees by_team file
      # written by build_league_moves (transactions.raw.json is gitignored).
      - name: Check every salary override matched a move
        run: |
          python scripts/build_moves.py \
            --use-cache --no-war --strict-overrides \
            --cache data/transactions/by_team/147.json \
            --out /tmp/override-check.json
